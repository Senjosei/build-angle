name: build-angle

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build"
        required: true
        default: x64
        type: choice
        options:
          - x64
  schedule:
    - cron: "0 23 * * 6"
  push:
    branches:
      - main

jobs:
  info:
    runs-on: ubuntu-24.04
    outputs:
      ANGLE_COMMIT: ${{ steps.info.outputs.ANGLE_COMMIT }}
      BUILD_DATE: ${{ steps.info.outputs.BUILD_DATE }}
    steps:
      - name: Get Latest Commit Id
        id: info
        run: |
          echo ANGLE_COMMIT=`git ls-remote https://chromium.googlesource.com/angle/angle HEAD | awk '{ print $1 }'` >> ${GITHUB_OUTPUT}
          echo BUILD_DATE=`date +'%Y-%m-%d'` >> ${GITHUB_OUTPUT}

  build:
    runs-on: windows-2025
    needs: info
    strategy:
      matrix:
        arch: [x64]
    env:
      ANGLE_COMMIT: ${{ needs.info.outputs.ANGLE_COMMIT }}
      BUILD_DATE: ${{ needs.info.outputs.BUILD_DATE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Visual Studio offline layout
        id: vs-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vs-layout
          key: ${{ runner.os }}-vs-layout-${{ runner.arch }}-2025-10
          restore-keys: |
            ${{ runner.os }}-vs-layout-${{ runner.arch }}-

      - name: Bootstrap VS offline layout
        if: steps.vs-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $layoutRoot = "C:\vs-layout"
          New-Item -ItemType Directory -Force -Path $layoutRoot | Out-Null

          $bootstrapper = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exee"

          & $bootstrapper `
            --layout $layoutRoot `
            --add Microsoft.VisualStudio.Workload.NativeDesktop `
            --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            --add Microsoft.VisualStudio.Component.Windows10SDK.10.0.28000 `
            --includeRecommended `
            --lang en-US `
            --quiet `
            --wait `
            --norestart

      - name: Install Windows SDK v10.0.28000 from cached layout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vsInstallPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          $layoutExe = "C:\vs-layout\vs_enterprise.exe"

          if (-not (Test-Path $layoutExe)) {
            throw "Expected cached VS layout bootstrapper at $layoutExe"
          }

          & $layoutExe modify `
            --installPath $vsInstallPath `
            --add Microsoft.VisualStudio.Component.Windows10SDK.10.0.28000 `
            --quiet `
            --wait `
            --norestart `
            --nocache

      - name: Run Build Script
        id: build
        shell: cmd
        run: call build.cmd ${{ matrix.arch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: angle-${{ matrix.arch }}-${{ needs.info.outputs.BUILD_DATE }}
          path: angle-${{ matrix.arch }}-${{ needs.info.outputs.BUILD_DATE }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    runs-on: ubuntu-24.04
    needs: [info, build]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create GitHub Release
        run: |
          echo '[angle commit](https://github.com/google/angle/commit/${{ needs.info.outputs.ANGLE_COMMIT }})' >>notes.txt
          gh release create ${{ needs.info.outputs.BUILD_DATE }} -R "${GITHUB_REPOSITORY}" -t '${{ needs.info.outputs.BUILD_DATE }}' -F notes.txt

      - name: Get Artifacts From Build Steps
        uses: actions/download-artifact@v8
        with:
          pattern: angle-*-${{ needs.info.outputs.BUILD_DATE }}
          merge-multiple: true

      - name: Upload Artifacts to GitHub Release
        run: gh release upload '${{ needs.info.outputs.BUILD_DATE }}' angle-*-${{ needs.info.outputs.BUILD_DATE }}.zip -R "${GITHUB_REPOSITORY}"
